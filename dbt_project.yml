name: clip_curator
version: "1.0.0"
config-version: 2
profile: clip_curator

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  clip_curator:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      core:
        +schema: core
      reporting:
        +schema: reporting

seeds:
  clip_curator:
    +schema: reference

vars:
  # quality gates: the build fails if any of these slip
  min_defect_recall: 0.95       # share of known-defect clips that must be rejected
  max_false_flag_rate: 0.02     # share of clean clips that may be rejected
  min_label_accuracy: 0.95      # AI scene labels vs. what each source video actually shows
  # near-duplicate: frames must line up one-for-one (aligned difference / unaligned difference)
  near_dupe_max_alignment_ratio: 0.62
  # out of focus: sharpness must also be under half the same source's typical sharpness
  blur_vs_source_ratio: 0.5
